<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Rosario</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- 🔥 TOAST DE FEEDBACK (carrito) -->
<!-- Permanece en el DOM; solo cambia su contenido y visibilidad, -->
<!-- para que aria-live anuncie el mensaje a tecnología asistiva. -->
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- 🔝 HEADER -->
<header class="header">
    <div class="header__container">

        <div class="header__logo">
            TIENDA ROSARIO
        </div>

        <nav class="header__nav">
            <ul class="nav__list">
                <li>Inicio</li>
                <li>Productos</li>
                <li>Ofertas</li>
            </ul>
        </nav>

        <div class="header__actions">
            <button class="btn-cart" aria-label="Carrito de compras">
  
  <svg xmlns="http://www.w3.org/2000/svg" 
       viewBox="0 0 24 24"
       fill="none" 
       stroke="currentColor" 
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round">
       
    <circle cx="9" cy="21" r="1"/>
    <circle cx="20" cy="21" r="1"/>
    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
  
  </svg>

  <span id="cart-count">0</span>

</button>
        </div>

    </div>
</header>

<!-- 🎥 HERO VIDEO -->
<section class="hero-video">

    <video class="hero-video__media" autoplay muted loop playsinline>
        <source src="assets/videos/" type="video/mp4">
    </video>

    <div class="hero-video__overlay"></div>

    <div class="hero-video__content">
        <h1>Nueva colección</h1>
        <p>Descubre lo último en tendencia</p>
        <button class="btn-primary">Comprar ahora</button>
    </div>

</section>

<!-- 🛍 PRODUCTOS -->
<section class="products">
    <div class="products__container">

        <h2 class="section-title">Productos</h2>

        <!--  FILTROS -->
        <div class="products__filters">
            <button data-categoria="all">Todos</button>
            <button data-categoria="bolsas">Bolsas</button>
            <button data-categoria="lapiceras">Lapiceras</button>
            <button data-categoria="mochilas">Mochilas</button>
        </div>

        <!--  GRID -->
        <div id="productos" class="products__grid">
            <!-- JS renderiza -->
        </div>

    </div>
</section>

<!--  WHATSAPP -->
<button class="whatsapp-btn">💬</button>

<div id="cart-panel" class="cart-panel">

  <div class="cart-panel__header">
    <h3>Carrito</h3>
    <button id="close-cart">X</button>
  </div>

  <div id="cart-items" class="cart-panel__items"></div>

  <div class="cart-total">
    <strong>Total:</strong>
    <span id="cart-total">$0</span>
  </div>

</div>

<!-- 🔻 FOOTER -->
<footer class="footer">
    <p>© 2026 Tienda Rosario</p>
</footer>

<!-- 🔥 MODAL PRODUCTO (MEJORADO) -->
<div id="product-modal" class="modal">
  <div class="modal__content">

    <!-- 🔥 BOTÓN CERRAR -->
    <button id="close-modal" class="modal__close">&times;</button>

    <div class="modal__body">

      <!-- 🔥 CARRUSEL: imagen + controles envueltos juntos, para que la  -->
      <!-- superposición de los controles en desktop se ancle exactamente -->
      <!-- al área de la imagen y no a todo el modal.                     -->
      <div class="modal__carousel">
        <!-- 🔥 IMAGEN CONTROLADA -->
        <div class="modal__image" id="modal-image">
          <!-- 🔥 Track desplazable: aquí se insertan las imágenes dinámicamente (js/app.js) -->
          <div class="modal__track" id="modal-track"></div>
        </div>

        <!-- 🔥 CONTROLES DEL CARRUSEL (flechas + dots) -->
        <!-- Desktop: se posicionan superpuestos sobre la imagen (igual que antes). -->
        <!-- Mobile/tablet pequeña (≤768px): quedan en una barra propia debajo. -->
        <div class="modal__controls" id="modal-controls">
          <button class="modal__arrow modal__arrow--left" aria-label="Imagen anterior">&#10094;</button>
          <div class="modal__dots" id="modal-dots"></div>
          <button class="modal__arrow modal__arrow--right" aria-label="Imagen siguiente">&#10095;</button>
        </div>
      </div>

      <!-- 🔥 INFO -->
      <div class="modal__info">
        <h2 id="modal-title" class="modal__title"></h2>
        <p id="modal-price" class="modal__price"></p>
        <p id="modal-description" class="modal__description"></p>

        <!-- 🔥 NUEVO BOTÓN -->
        <button class="product-card__btn" id="modal-add">
          AGREGAR
        </button>
      </div>

    </div>
  </div>
</div>

<!-- 🔥 JS -->
<script src="data/productos.js"></script>
<script src="js/carrito.js"></script>
<script src="js/app.js"></script>

</body>
</html>
